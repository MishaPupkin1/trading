<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pocket 5-Indicator Confluence Trading Signals</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #09111f;
      --bg-glow: #12233e;
      --surface: rgba(17, 28, 52, 0.94);
      --card: #101b34;
      --stroke: rgba(113, 146, 214, 0.12);
      --text: #f4f7ff;
      --muted: #8c9ab7;
      --accent-a: #22dfc8;
      --accent-b: #5db8ff;
      --sell: #ff6c7d;
      --buy: #5ce38b;
      --warn: #ffd36a;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --font-main: "Segoe UI", "Inter", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color-scheme: dark;
      font-family: var(--font-main);
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(46, 89, 164, 0.34), transparent 34%),
        radial-gradient(circle at bottom left, rgba(34, 223, 200, 0.16), transparent 30%),
        linear-gradient(180deg, #08111e 0%, #060c18 100%);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
    }

    .app-shell {
      width: min(100%, 430px);
      position: relative;
    }

    .hero { padding: 8px 6px 18px; text-align: center; }

    .hero__title {
      margin: 0;
      font-size: 1.85rem;
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 40%, var(--accent-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, rgba(18, 28, 52, 0.96), rgba(10, 19, 37, 0.98));
      border: 1px solid var(--stroke);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-header__icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(96, 173, 255, 0.1);
      border: 1px solid rgba(96, 173, 255, 0.2);
      color: var(--accent-b);
      font-size: 0.9rem;
    }

    .section-header__title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .field-stack {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: #8c9ab7;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-shell, .select-shell {
      background: linear-gradient(180deg, rgba(13, 22, 42, 0.98), rgba(10, 17, 34, 0.98));
      border: 1px solid rgba(138, 159, 204, 0.16);
      border-radius: var(--radius-md);
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      transition: border-color 0.2s;
    }

    .input-shell:focus-within, .select-shell:focus-within {
      border-color: var(--accent-a);
    }

    .input-shell input, .select-shell select {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
    }

    .select-shell select option {
      background: #0d1730;
      color: var(--text);
    }

    .expiry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .expiry-chip {
      background: rgba(13, 22, 42, 0.8);
      border: 1px solid rgba(138, 159, 204, 0.14);
      border-radius: var(--radius-sm);
      padding: 9px 4px;
      color: #9cb0d8;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      transition: all 160ms ease;
    }

    .expiry-chip.active {
      background: rgba(34, 223, 200, 0.16);
      border-color: var(--accent-a);
      color: var(--accent-a);
      box-shadow: 0 0 12px rgba(34, 223, 200, 0.2);
    }

    .indicator-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--accent-a), #48cceb 50%, var(--accent-b));
      color: #061124;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(34, 223, 200, 0.35);
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .btn-action:hover { transform: translateY(-2px); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .signal-card {
      display: none;
      background: linear-gradient(180deg, rgba(16, 27, 52, 0.98), rgba(12, 20, 39, 0.98));
      border: 1px solid rgba(138, 159, 204, 0.18);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease-out;
    }

    .signal-card.is-visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .signal-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: var(--radius-lg);
      background: rgba(8, 15, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 14px;
    }

    .signal-hero__icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1.3rem;
    }

    .signal-hero__icon.buy {
      background: rgba(92, 227, 139, 0.16);
      color: var(--buy);
      border: 1px solid rgba(92, 227, 139, 0.3);
    }

    .signal-hero__icon.sell {
      background: rgba(255, 108, 125, 0.16);
      color: var(--sell);
      border: 1px solid rgba(255, 108, 125, 0.3);
    }

    .signal-hero__icon.neutral {
      background: rgba(255, 211, 106, 0.16);
      color: var(--warn);
      border: 1px solid rgba(255, 211, 106, 0.3);
    }

    .signal-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .signal-title.buy { color: var(--buy); }
    .signal-title.sell { color: var(--sell); }
    .signal-title.neutral { color: var(--warn); }

    .signal-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .indicators-grid-5 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .ind-box {
      background: rgba(9, 17, 33, 0.8);
      border: 1px solid rgba(113, 146, 214, 0.12);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
    }

    .ind-box__name {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .ind-box__val {
      font-size: 0.82rem;
      font-weight: 800;
      margin-top: 3px;
    }

    .ind-box__val.buy { color: var(--buy); }
    .ind-box__val.sell { color: var(--sell); }
    .ind-box__val.neutral { color: var(--warn); }

    .cooldown-banner {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: rgba(18, 35, 62, 0.8);
      border: 1px solid rgba(93, 184, 255, 0.2);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 0.82rem;
      color: var(--accent-b);
    }
    .cooldown-banner.is-active { display: block; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <h1 class="hero__title" id="pageTitle">PRO CONFLUENCE TRADING</h1>
    </header>

    <main class="panel">
      <div class="field-stack">
        <!-- Язык -->
        <div class="field">
          <label id="lblLang">Язык интерфейса</label>
          <div class="select-shell">
            <select id="langSelect">
              <option value="ru">🇷🇺 Русский</option>
              <option value="en">🇬🇧 English</option>
              <option value="uz">🇺🇿 O'zbek</option>
            </select>
          </div>
        </div>

        <!-- Экспирация -->
        <div class="field">
          <label id="lblExpiry">Время экспирации</label>
          <div class="expiry-grid" id="expiryGrid">
            <button class="expiry-chip" data-val="3S">3S</button>
            <button class="expiry-chip" data-val="15S">15S</button>
            <button class="expiry-chip" data-val="30S">30S</button>
            <button class="expiry-chip active" data-val="1M">1M</button>
            <button class="expiry-chip" data-val="3M">3M</button>
            <button class="expiry-chip" data-val="5M">5M</button>
            <button class="expiry-chip" data-val="30M">30M</button>
            <button class="expiry-chip" data-val="1H">1H</button>
            <button class="expiry-chip" data-val="4H">4H</button>
          </div>
        </div>

        <!-- Ввод Индикаторов -->
        <div class="section-header" style="margin-top: 4px; margin-bottom: 2px;">
          <div class="section-header__icon">⚡</div>
          <h2 class="section-header__title" id="lblIndHeader">5 Индикаторов рынка</h2>
        </div>

        <!-- RSI & Stochastic -->
        <div class="indicator-fields">
          <div class="field">
            <label id="lblRsi">RSI (14)</label>
            <div class="input-shell">
              <input type="number" id="rsiInput" min="0" max="100" value="30" placeholder="0-100">
            </div>
          </div>
          <div class="field">
            <label id="lblStoch">Stochastic</label>
            <div class="input-shell">
              <input type="number" id="stochInput" min="0" max="100" value="20" placeholder="0-100">
            </div>
          </div>
        </div>

        <!-- EMA 200 Trend -->
        <div class="field">
          <label id="lblEma">EMA 200 (Фильтр тренда)</label>
          <div class="select-shell">
            <select id="emaSelect">
              <option value="above" id="optEmaAbove">🟢 Цена ВЫШЕ EMA 200 (Бычий тренд)</option>
              <option value="below" id="optEmaBelow">🔴 Цена НИЖЕ EMA 200 (Медвежий тренд)</option>
            </select>
          </div>
        </div>

        <!-- MACD Impulse -->
        <div class="field">
          <label id="lblMacd">MACD (12,26,9) Импульс</label>
          <div class="select-shell">
            <select id="macdSelect">
              <option value="bullish" id="optMacdBull">🟢 Бычий импульс (Пересечение вверх / Зелёная)</option>
              <option value="bearish" id="optMacdBear">🔴 Медвежий импульс (Пересечение вниз / Красная)</option>
              <option value="neutral" id="optMacdNeu">⚪ Нейтрально (Флэт)</option>
            </select>
          </div>
        </div>

        <!-- Bollinger Bands Position -->
        <div class="field">
          <label id="lblBb">Bollinger Bands Канал</label>
          <div class="select-shell">
            <select id="bbSelect">
              <option value="lower" id="optBbLower">🟢 Касание НИЖНЕЙ полосы (Отскок ВВЕРХ)</option>
              <option value="upper" id="optBbUpper">🔴 Касание ВЕРХНЕЙ полосы (Отскок ВНИЗ)</option>
              <option value="neutral" id="optBbNeu">⚪ Внутри канала (Нейтрально)</option>
            </select>
          </div>
        </div>

        <button class="btn-action" id="analyzeBtn">Проанализировать 5 индикаторов 🚀</button>
      </div>
    </main>

    <!-- Карточка Сигнала -->
    <section class="signal-card" id="signalCard">
      <div class="signal-hero">
        <div class="signal-hero__icon" id="signalIcon">⚡</div>
        <div>
          <div class="signal-title" id="signalDirection">CALL (ВВЕРХ)</div>
          <div class="signal-meta" id="signalMeta">Экспирация: 1M • Точность: <b id="signalAcc">92%</b></div>
        </div>
      </div>

      <div class="indicators-grid-5">
        <div class="ind-box">
          <div class="ind-box__name">RSI (14)</div>
          <div class="ind-box__val" id="indRsiVal">30 🟢</div>
        </div>
        <div class="ind-box">
          <div class="ind-box__name">Stochastic</div>
          <div class="ind-box__val" id="indStochVal">20 🟢</div>
        </div>
        <div class="ind-box">
          <div class="ind-box__name">EMA 200</div>
          <div class="ind-box__val" id="indEmaVal">Выше 🟢</div>
        </div>
        <div class="ind-box">
          <div class="ind-box__name">MACD</div>
          <div class="ind-box__val" id="indMacdVal">Бычий 🟢</div>
        </div>
        <div class="ind-box">
          <div class="ind-box__name">Bollinger</div>
          <div class="ind-box__val" id="indBbVal">Нижняя 🟢</div>
        </div>
        <div class="ind-box">
          <div class="ind-box__name">Confluence</div>
          <div class="ind-box__val" id="indConfVal">95% 🔥</div>
        </div>
      </div>

      <div class="cooldown-banner" id="cooldownBanner">
        <span id="cooldownLabel">⏱ До следующего анализа:</span> <b id="cooldownTimer">00:00</b>
      </div>
    </section>
  </div>

    if (tg) { tg.ready(); tg.expand(); }

    const i18n = {

    let currentLang = "ru";
    let currentExpiry = "1M";
    let cooldownUntil = 0;
    let cooldownTimerId = null;

    const langSelect = document.getElementById("langSelect");
    const expiryGrid = document.getElementById("expiryGrid");
    const emaSelect = document.getElementById("emaSelect");
    const macdSelect = document.getElementById("macdSelect");
    const bbSelect = document.getElementById("bbSelect");
    const analyzeBtn = document.getElementById("analyzeBtn");

    const signalCard = document.getElementById("signalCard");
    const signalIcon = document.getElementById("signalIcon");
    const signalDirection = document.getElementById("signalDirection");
    const signalMeta = document.getElementById("signalMeta");
    const signalAcc = document.getElementById("signalAcc");

    const indRsiVal = document.getElementById("indRsiVal");
    const indStochVal = document.getElementById("indStochVal");
    const indEmaVal = document.getElementById("indEmaVal");
    const indMacdVal = document.getElementById("indMacdVal");
    const indBbVal = document.getElementById("indBbVal");
    const indConfVal = document.getElementById("indConfVal");

    const cooldownBanner = document.getElementById("cooldownBanner");
    const cooldownTimer = document.getElementById("cooldownTimer");
    const cooldownLabel = document.getElementById("cooldownLabel");

    function setLanguage(lang) {
      if (!i18n[lang]) lang = "ru";
      currentLang = lang;
      langSelect.value = lang;
      const t = i18n[lang];

      document.getElementById("pageTitle").textContent = t.pageTitle;
      document.getElementById("lblLang").textContent = t.lblLang;
      document.getElementById("lblExpiry").textContent = t.lblExpiry;
      document.getElementById("lblIndHeader").textContent = t.lblIndHeader;
      document.getElementById("lblRsi").textContent = t.lblRsi;
      document.getElementById("lblStoch").textContent = t.lblStoch;
      document.getElementById("lblEma").textContent = t.lblEma;
      document.getElementById("lblMacd").textContent = t.lblMacd;
      document.getElementById("lblBb").textContent = t.lblBb;

      document.getElementById("optEmaAbove").textContent = t.emaAbove;
      document.getElementById("optEmaBelow").textContent = t.emaBelow;

      document.getElementById("optMacdBull").textContent = t.macdBullish;
      document.getElementById("optMacdBear").textContent = t.macdBearish;
      document.getElementById("optMacdNeu").textContent = t.macdNeutral;

      document.getElementById("optBbLower").textContent = t.bbLower;
      document.getElementById("optBbUpper").textContent = t.bbUpper;
      document.getElementById("optBbNeu").textContent = t.bbNeutral;

      if (Date.now() >= cooldownUntil) {
        analyzeBtn.textContent = t.btnAnalyze;
      } else {
        analyzeBtn.textContent = t.btnCooldown;
      }
      cooldownLabel.textContent = t.cooldownLabel;
    }

    langSelect.addEventListener("change", (e) => setLanguage(e.target.value));

    expiryGrid.querySelectorAll(".expiry-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        expiryGrid.querySelectorAll(".expiry-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        currentExpiry = chip.dataset.val;
      });
    });

    function analyzeMarket() {
      const rsi = parseFloat(document.getElementById("rsiInput").value) || 50;
      const stoch = parseFloat(document.getElementById("stochInput").value) || 50;
      const emaTrend = emaSelect.value;
      const macdImpulse = macdSelect.value;
      const bbPosition = bbSelect.value;

      let callScore = 0;
      let putScore = 0;

      // 1. RSI (25%) - Симметричные пороговые уровни
      if (rsi <= 30) callScore += 25;
      else if (rsi <= 40) callScore += 15;
      else if (rsi >= 70) putScore += 25;
      else if (rsi >= 60) putScore += 15;

      // 2. Stochastic (25%)
      if (stoch <= 20) callScore += 25;
      else if (stoch <= 30) callScore += 15;
      else if (stoch >= 80) putScore += 25;
      else if (stoch >= 70) putScore += 15;

      // 3. EMA 200 (20%) - Фильтр генерального тренда
      if (emaTrend === "above") callScore += 20;
      else if (emaTrend === "below") putScore += 20;

      // 4. MACD (15%) - Импульс
      if (macdImpulse === "bullish") callScore += 15;
      else if (macdImpulse === "bearish") putScore += 15;

      // 5. Bollinger Bands (15%) - Канал цены
      if (bbPosition === "lower") callScore += 15;
      else if (bbPosition === "upper") putScore += 15;

      let direction = "NEUTRAL";
      let accuracy = 0;

      // Условие выдачи сигнала: минимум 60% баллов сходимости
      if (callScore >= 60 && callScore > putScore) {
        direction = "BUY";
        // Фильтр по тренду EMA: если торгуем ПО тренду EMA 200, точность выше
        const trendBonus = (emaTrend === "above") ? 5 : -5;
        accuracy = Math.min(98, Math.max(68, callScore + trendBonus));
      } else if (putScore >= 60 && putScore > callScore) {
        direction = "SELL";
        const trendBonus = (emaTrend === "below") ? 5 : -5;
        accuracy = Math.min(98, Math.max(68, putScore + trendBonus));
      }

      return { direction, accuracy, rsi, stoch, emaTrend, macdImpulse, bbPosition, callScore, putScore };
    }

    analyzeBtn.addEventListener("click", () => {
      if (Date.now() < cooldownUntil) return;

      const res = analyzeMarket();
      const t = i18n[currentLang];

      signalCard.classList.add("is-visible");

      if (res.direction === "BUY") {
        signalIcon.className = "signal-hero__icon buy";
        signalIcon.innerHTML = "▲";
        signalDirection.className = "signal-title buy";
        signalDirection.textContent = t.signalCall;
        signalAcc.textContent = res.accuracy + "%";
      } else if (res.direction === "SELL") {
        signalIcon.className = "signal-hero__icon sell";
        signalIcon.innerHTML = "▼";
        signalDirection.className = "signal-title sell";
        signalDirection.textContent = t.signalPut;
        signalAcc.textContent = res.accuracy + "%";
      } else {
        signalIcon.className = "signal-hero__icon neutral";
        signalIcon.innerHTML = "⚠️";
        signalDirection.className = "signal-title neutral";
        signalDirection.textContent = t.signalSkip;
        signalAcc.textContent = "—";
      }

      signalMeta.innerHTML = `${t.metaExpiry}: <b>${currentExpiry}</b> • ${t.metaAcc}: <b id="signalAcc">${res.direction === "NEUTRAL" ? "—" : res.accuracy + "%"}</b>`;

      indRsiVal.textContent = `${res.rsi} ${res.rsi <= 30 ? '🟢' : res.rsi >= 70 ? '🔴' : '⚪'}`;
      indRsiVal.className = `ind-box__val ${res.rsi <= 30 ? 'buy' : res.rsi >= 70 ? 'sell' : 'neutral'}`;

      indStochVal.textContent = `${res.stoch} ${res.stoch <= 20 ? '🟢' : res.stoch >= 80 ? '🔴' : '⚪'}`;
      indStochVal.className = `ind-box__val ${res.stoch <= 20 ? 'buy' : res.stoch >= 80 ? 'sell' : 'neutral'}`;

      indEmaVal.textContent = res.emaTrend === 'above' ? t.emaAboveVal : t.emaBelowVal;
      indEmaVal.className = `ind-box__val ${res.emaTrend === 'above' ? 'buy' : 'sell'}`;

      indMacdVal.textContent = res.macdImpulse === 'bullish' ? t.macdBullVal : res.macdImpulse === 'bearish' ? t.macdBearVal : t.macdNeuVal;
      indMacdVal.className = `ind-box__val ${res.macdImpulse === 'bullish' ? 'buy' : res.macdImpulse === 'bearish' ? 'sell' : 'neutral'}`;

      indBbVal.textContent = res.bbPosition === 'lower' ? t.bbLowerVal : res.bbPosition === 'upper' ? t.bbUpperVal : t.bbNeuVal;
      indBbVal.className = `ind-box__val ${res.bbPosition === 'lower' ? 'buy' : res.bbPosition === 'upper' ? 'sell' : 'neutral'}`;

      const totalConf = Math.max(res.callScore, res.putScore);
      indConfVal.textContent = `${totalConf}% ${totalConf >= 80 ? '🔥' : totalConf >= 60 ? '🟢' : '⚪'}`;
      indConfVal.className = `ind-box__val ${totalConf >= 80 ? 'buy' : totalConf >= 60 ? 'buy' : 'neutral'}`;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred(res.direction === "NEUTRAL" ? "warning" : "success");
      }

      startCooldown(15);
    });

    function startCooldown(seconds) {
      cooldownUntil = Date.now() + seconds * 1000;
      analyzeBtn.disabled = true;
      cooldownBanner.classList.add("is-active");

      if (cooldownTimerId) clearInterval(cooldownTimerId);

      cooldownTimerId = setInterval(() => {
        const left = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
        cooldownTimer.textContent = `00:${String(left).padStart(2, "0")}`;

        if (left <= 0) {
          clearInterval(cooldownTimerId);
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = i18n[currentLang].btnAnalyze;
          cooldownBanner.classList.remove("is-active");
        }
      }, 250);
    }

    // Auto detect language from URL ?lang=en or Telegram user lang
    const urlParams = new URLSearchParams(window.location.search);
    const paramLang = urlParams.get("lang");
    const initLang = paramLang || (tg?.initDataUnsafe?.user?.language_code || "ru").toLowerCase();
    setLanguage(initLang.includes("uz") ? "uz" : initLang.includes("en") ? "en" : "ru");
  </script>
